name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project.zip
        run: |
          command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip)
          ls -la
          rm -rf game && mkdir game
          unzip -q project.zip -d game

      - name: Export debug APK
        run: |
          PROJ=$(dirname "$(find game -name project.godot | head -n 1)")
          echo "Project folder: $PROJ"
          mkdir -p build
          cd "$PROJ"
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" "$GITHUB_WORKSPACE/build/OpenWorldStage1.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWorldStage1-apk
          path: build/OpenWorldStage1.apk
