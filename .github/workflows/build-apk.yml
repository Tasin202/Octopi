name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/OpenWorldStage1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWorldStage1-apk
          path: build/OpenWorldStage1.apk
